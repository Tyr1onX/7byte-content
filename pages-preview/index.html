<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7BYTE · Episode Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #090a08; overflow: hidden; }
      body { display: grid; place-items: center; }
      .frame {
        position: relative;
        width: min(96vw, calc(96vh * 9 / 16));
        aspect-ratio: 9 / 16;
        overflow: hidden;
        background: #0f100e;
      }
      motion-canvas-player { display: block; width: 100%; height: 100%; }
      .status {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 28px;
        background: rgba(15,16,14,.94);
        color: #f4f1e8;
        text-align: center;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        transition: opacity .2s ease;
      }
      .status[data-state="ready"] { opacity: 0; pointer-events: none; }
      .status-card { width: min(100%, 420px); }
      .status-title { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
      .status-detail { margin: 0; color: #9da198; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
      .status[data-state="error"] { background: rgba(15,16,14,.98); }
      .status[data-state="error"] .status-title { color: #f0c4b9; }
    </style>
    <script src="./project-manifest.js"></script>
  </head>
  <body>
    <div class="frame">
      <motion-canvas-player id="player" width="1080" height="1920" quality="1" auto="true"></motion-canvas-player>
      <div id="status" class="status" data-state="loading">
        <div class="status-card">
          <p id="status-title" class="status-title">正在加载动画…</p>
          <p id="status-detail" class="status-detail">如果加载失败，具体错误会显示在这里。</p>
        </div>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
