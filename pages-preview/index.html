<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7BYTE · Episode Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0d0e0c; color: #f2f0e7; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      h1 { margin: 0; font-size: 18px; letter-spacing: .08em; }
      small { color: #969a90; }
      .frame { position: relative; width: 100%; aspect-ratio: 9 / 16; border: 1px solid #30332d; border-radius: 18px; overflow: hidden; background: #111210; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      motion-canvas-player { display: block; width: 100%; height: 100%; }
      .status { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 32px; background: rgba(17,18,16,.9); text-align: center; transition: opacity .25s ease; }
      .status[data-state="ready"] { opacity: 0; pointer-events: none; }
      .status-card { width: min(100%, 420px); }
      .status-title { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
      .status-detail { margin: 0; color: #9da198; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
      .status[data-state="error"] { background: rgba(17,18,16,.97); }
      .status[data-state="error"] .status-title { color: #f0c4b9; }
      .hint { position: absolute; left: 50%; bottom: 18px; translate: -50% 0; z-index: 3; pointer-events: none; padding: 7px 11px; border: 1px solid #34382f; border-radius: 999px; background: rgba(17,18,16,.82); color: #b9bcb3; font-size: 12px; white-space: nowrap; }
      p { margin: 12px 2px 0; color: #8f9389; font-size: 13px; line-height: 1.6; }
    </style>
    <script src="./project-manifest.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>7BYTE · EP.001</h1>
        <small>Pages preview</small>
      </header>
      <div class="frame">
        <motion-canvas-player id="player" width="1080" height="1920" quality="0.5" auto></motion-canvas-player>
        <div id="status" class="status" data-state="loading">
          <div class="status-card">
            <p id="status-title" class="status-title">正在初始化播放器…</p>
            <p id="status-detail" class="status-detail">如果加载失败，具体错误会直接显示在这里。</p>
          </div>
        </div>
        <div class="hint">自动播放 · 点击画面暂停 / 继续</div>
      </div>
      <p>此页面只用于远程验收 Motion Canvas 动画，不替代本地编辑器。</p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
