name: ep002-v20-diagnostic-fix-render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-v20-diagnostic-fix-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for run id
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish run id early
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-v20-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          printf '%s\n' "$GITHUB_RUN_ID" > preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 V20 render run id"
          git push origin HEAD:ep002-v20-render-previews --force

      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - name: Build V20 diagnostic cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('episodes/002-wifi-full-signal/src/scenes/main-v19.tsx')
          source = src.read_text(encoding='utf-8')

          old_decl = '''  const handoffDevice = createRef<Rect>();
  const diagnostic = createRef<Layout>();
  const diagTitle = createRef<Txt>();
  const diagWeb = createRef<Rect>();
  const diagYourLabel = createRef<Layout>();
  const diagOther = createRef<Rect>();'''
          new_decl = '''  const handoffDevice = createRef<Rect>();
  const handoffLabel = createRef<Txt>();
  const diagnostic = createRef<Layout>();
  const diagTitle = createRef<Txt>();
  const diagCurrentStatus = createRef<Layout>();
  const diagOther = createRef<Rect>();'''
          if old_decl not in source:
              raise SystemExit('V19 diagnostic declarations not found')
          source = source.replace(old_decl, new_decl, 1)

          old_handoff = '''      {/* Persistent device used to bridge topology into diagnosis. */}
      <Rect ref={handoffDevice} x={-760} y={-30} width={166} height={184} radius={30} fill={'#141512'} stroke={C.border} lineWidth={2} opacity={0}>
        <Icon icon={'lucide:smartphone'} y={-26} size={70} color={C.text} />
        <Txt y={48} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
      </Rect>'''
          new_handoff = '''      {/* Root-level transition proxy. It may bridge Shot 3 → 4 only; V20 explicitly ends its lifecycle before Shot 5. */}
      <Rect ref={handoffDevice} x={-760} y={-30} width={166} height={184} radius={30} fill={'#141512'} stroke={C.border} lineWidth={2} opacity={0}>
        <Icon icon={'lucide:smartphone'} y={-26} size={70} color={C.text} />
        <Txt ref={handoffLabel} y={48} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
      </Rect>'''
          if old_handoff not in source:
              raise SystemExit('V19 handoff proxy block not found')
          source = source.replace(old_handoff, new_handoff, 1)

          old_diag = '''      {/* SHOT 4 — open diagnostic composition, no full-page panel swap. */}
      <Layout ref={diagnostic} width={1920} height={1080} opacity={0}>
        <Txt ref={diagTitle} y={-330} text={'快速判断：问题在哪一侧？'} fill={C.text} fontFamily={FONT} fontSize={44} fontWeight={780} />

        <Rect ref={diagWeb} x={-520} y={-70} width={330} height={180} radius={26} fill={C.surface} stroke={C.border} lineWidth={2}>
          <Icon icon={'lucide:globe-2'} y={-42} size={52} color={C.blue} />
          <Txt y={25} text={'换一个网站'} fill={C.text} fontFamily={FONT} fontSize={27} fontWeight={700} />
          <Txt y={66} text={'仍然打不开'} fill={C.danger} fontFamily={FONT} fontSize={21} fontWeight={700} />
        </Rect>

        <Layout ref={diagYourLabel} x={-250} y={145} layout direction={'column'} gap={8} alignItems={'center'} opacity={0}>
          <Txt text={'你的设备'} fill={C.text} fontFamily={FONT} fontSize={27} fontWeight={720} />
          <Txt text={'× 上不了网'} fill={C.danger} fontFamily={FONT} fontSize={22} fontWeight={700} />
        </Layout>

        <Icon icon={'lucide:arrow-right'} x={40} y={-30} size={46} color={C.muted} />

        <Rect ref={diagOther} x={350} y={-20} width={310} height={220} radius={28} fill={C.surface} stroke={C.border} lineWidth={2} opacity={0}>
          <Icon icon={'lucide:tablet-smartphone'} y={-55} size={58} color={C.text} />
          <Txt y={20} text={'另一台设备'} fill={C.text} fontFamily={FONT} fontSize={27} fontWeight={700} />
          <Txt ref={otherState} y={73} text={'等待检查'} fill={C.muted} fontFamily={FONT} fontSize={22} fontWeight={650} />
        </Rect>

        <Rect ref={diagResult} y={270} width={920} height={82} radius={22} fill={'#11120F'} stroke={C.border} lineWidth={2} opacity={0}>
          <Txt text={'多个设备都失败 → 优先检查网络侧'} fill={C.accent} fontFamily={FONT} fontSize={28} fontWeight={720} />
        </Rect>
      </Layout>'''
          new_diag = '''      {/* SHOT 4 — one current-device cluster → one comparison device. */}
      <Layout ref={diagnostic} width={1920} height={1080} opacity={0}>
        <Txt ref={diagTitle} y={-330} text={'快速判断：问题在哪一侧？'} fill={C.text} fontFamily={FONT} fontSize={44} fontWeight={780} />

        {/* The handoff device itself is the only visual owner of “your device”.
            This text cluster adds the website test without creating a second card or duplicate device label. */}
        <Layout ref={diagCurrentStatus} x={-290} y={-20} layout direction={'column'} gap={14} alignItems={'start'} opacity={0}>
          <Layout layout direction={'row'} gap={14} alignItems={'center'}>
            <Icon icon={'lucide:globe-2'} size={42} color={C.blue} />
            <Txt text={'换一个网站'} fill={C.text} fontFamily={FONT} fontSize={29} fontWeight={720} />
          </Layout>
          <Txt x={56} text={'仍然打不开'} fill={C.danger} fontFamily={FONT} fontSize={23} fontWeight={700} />
          <Txt x={56} text={'当前设备仍失败'} fill={C.muted} fontFamily={FONT} fontSize={19} fontWeight={540} />
        </Layout>

        <Icon icon={'lucide:arrow-right'} x={70} y={-20} size={46} color={C.muted} />

        <Rect ref={diagOther} x={410} y={-20} width={330} height={220} radius={28} fill={C.surface} stroke={C.border} lineWidth={2} opacity={0}>
          <Icon icon={'lucide:tablet-smartphone'} y={-55} size={58} color={C.text} />
          <Txt y={20} text={'另一台设备'} fill={C.text} fontFamily={FONT} fontSize={27} fontWeight={700} />
          <Txt ref={otherState} y={73} text={'等待检查'} fill={C.muted} fontFamily={FONT} fontSize={22} fontWeight={650} />
        </Rect>

        <Rect ref={diagResult} y={270} width={900} height={82} radius={22} fill={'#11120F'} stroke={C.border} lineWidth={2} opacity={0}>
          <Txt text={'多个设备都失败 → 优先检查网络侧'} fill={C.accent} fontFamily={FONT} fontSize={28} fontWeight={720} />
        </Rect>
      </Layout>'''
          if old_diag not in source:
              raise SystemExit('V19 diagnostic JSX block not found')
          source = source.replace(old_diag, new_diag, 1)

          old_transition = '''  // 37.869–45.063 — V19 object handoff: the same device survives into diagnosis.
  handoffDevice().position([-760, -30]);
  handoffDevice().scale(1);
  yield* all(
    waitFor(phase(7, 8)),
    handoffDevice().opacity(1, 0.08),
    chainPhone().opacity(0, 0.08),
    chainRouter().opacity(0, 0.30),
    chainIsp().opacity(0, 0.30),
    chainDns().opacity(0, 0.30),
    chainServer().opacity(0, 0.30),
    c1().opacity(0, 0.24),
    c2().opacity(0, 0.24),
    c3().opacity(0, 0.24),
    c4().opacity(0, 0.24),
    delay(0.12, diagnostic().opacity(1, 0.34, easeInOutCubic)),
    delay(
      0.12,
      all(
        handoffDevice().position([-250, -20], 0.92, easeInOutCubic),
        handoffDevice().scale(1.18, 0.92, easeInOutCubic),
      ),
    ),
    delay(0.62, diagYourLabel().opacity(1, 0.28, easeInOutCubic)),
    delay(0.72, diagOther().opacity(1, 0.30, easeInOutCubic)),
    delay(1.05, chain().opacity(0, 0.18)),
  );'''
          new_transition = '''  // 37.869–45.063 — V20 object handoff with single semantic ownership.
  handoffDevice().position([-760, -30]);
  handoffDevice().scale(1);
  handoffLabel().text('你的设备');
  yield* all(
    waitFor(phase(7, 8)),
    handoffDevice().opacity(1, 0.08),
    chainPhone().opacity(0, 0.08),
    chainRouter().opacity(0, 0.30),
    chainIsp().opacity(0, 0.30),
    chainDns().opacity(0, 0.30),
    chainServer().opacity(0, 0.30),
    c1().opacity(0, 0.24),
    c2().opacity(0, 0.24),
    c3().opacity(0, 0.24),
    c4().opacity(0, 0.24),
    delay(0.12, diagnostic().opacity(1, 0.34, easeInOutCubic)),
    delay(
      0.12,
      all(
        handoffDevice().position([-560, -20], 0.92, easeInOutCubic),
        handoffDevice().scale(1.00, 0.92, easeInOutCubic),
      ),
    ),
    delay(0.48, diagCurrentStatus().opacity(1, 0.28, easeInOutCubic)),
    delay(0.78, diagOther().opacity(1, 0.30, easeInOutCubic)),
    delay(1.05, chain().opacity(0, 0.18)),
  );'''
          if old_transition not in source:
              raise SystemExit('V19 Shot 3→4 transition block not found')
          source = source.replace(old_transition, new_transition, 1)

          old_final = '''  // 49.005–52.882 — Keep motion continuity into the final explanation.
  yield* all(
    waitFor(phase(9, 10)),
    diagnostic().opacity(0, 0.30),
    handoffDevice().position([-430, -95], 0.68, easeInOutCubic),
    handoffDevice().scale(0.90, 0.68, easeInOutCubic),
    delay(0.18, takeaway().opacity(1, 0.36, easeInOutCubic)),
    delay(0.72, handoffDevice().opacity(0, 0.24)),
  );'''
          new_final = '''  // 49.005–52.882 — End the bridge proxy before Shot 5 owns the next concept.
  // V19 let the root-level handoffDevice remain visible for 0.72s after takeaway appeared,
  // which created the visible “ghost device” residue. V20 closes the proxy lifecycle first.
  yield* all(
    waitFor(phase(9, 10)),
    diagnostic().opacity(0, 0.24, easeInOutCubic),
    handoffDevice().opacity(0, 0.20, easeInOutCubic),
    delay(0.22, takeaway().opacity(1, 0.36, easeInOutCubic)),
  );'''
          if old_final not in source:
              raise SystemExit('V19 Shot 4→5 transition block not found')
          source = source.replace(old_final, new_final, 1)

          out = Path('episodes/002-wifi-full-signal/src/scenes/main-v20.tsx')
          out.write_text(source, encoding='utf-8')

          project = Path('episodes/002-wifi-full-signal/src/project.ts')
          p = project.read_text(encoding='utf-8')
          if './scenes/main-v19?scene' not in p:
              raise SystemExit('project.ts does not point to V19')
          project.write_text(p.replace('./scenes/main-v19?scene', './scenes/main-v20?scene', 1), encoding='utf-8')

          notes = Path('episodes/002-wifi-full-signal/design-notes.md')
          n = notes.read_text(encoding='utf-8')
          marker = '## V20 diagnostic ownership + residue fix'
          if marker not in n:
              n += '''\n\n## V20 diagnostic ownership + residue fix\n\n### Root cause\n\nV19 introduced a root-level `handoffDevice` to preserve object continuity from Shot 3 into Shot 4. Because that proxy lived **outside** the `diagnostic` layout, fading `diagnostic` to zero did not hide the proxy. The Shot 4→5 transition then intentionally kept `handoffDevice` visible for another 0.72 s while the takeaway scene was already visible. That produced the visible ghost-device residue.\n\nThe left side of Shot 4 also split one concept into three separate visual owners: `diagWeb` card + `handoffDevice` card + `diagYourLabel`. The nearly touching cards and repeated “device / your device” labels created unnecessary hierarchy and crowding.\n\n### V20 fix\n\n- The handoff proxy is the **only** visual owner of “your device” in Shot 4; its label becomes `你的设备`.\n- The website test is now a lightweight text/status cluster beside the device instead of another large card.\n- The duplicate `diagYourLabel` is removed.\n- The comparison device remains a single card on the right.\n- Before Shot 5 appears, the root-level handoff proxy is explicitly faded to zero; it no longer travels into the takeaway scene.\n\n### Permanent transition-proxy gate\n\n1. Every transition proxy must declare exactly one source owner and one target owner.\n2. A proxy may exist only during that ownership handoff; it must have an explicit end-of-life before a later shot introduces another representation of the same semantic object.\n3. **Never allow two visible objects to represent the same semantic entity at a stable frame.** Brief crossfade overlap is allowed only inside the handoff window.\n4. Root-level proxies are not governed by child-shot opacity. Every root-level proxy therefore requires its own explicit exit animation / opacity reset.\n5. Audit every transition at: boundary −3 frames, boundary frame, +3 frames, handoff midpoint, and first stable frame after the handoff. Check for duplicate labels, ghost objects, connector residue, and premature next-shot elements.\n6. Object continuity is subordinate to semantic clarity: if preserving an object produces duplicate cards or labels, simplify the target composition rather than forcing the proxy to persist.\n'''
          notes.write_text(n, encoding='utf-8')
          PY

          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/002-wifi-full-signal/src/scenes/main-v20.tsx episodes/002-wifi-full-signal/src/project.ts episodes/002-wifi-full-signal/design-notes.md
          git commit -m "fix(ep002): clean diagnostic ownership and transition residue"
          git push origin HEAD:feat/ep002-wifi-full-signal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture 1920x1080 at 60fps
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '62500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-v20-silent-60fps.webm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ep002-v20-silent-60fps
          path: output/ep002-v20-silent-60fps.webm
          if-no-files-found: error
          retention-days: 2
