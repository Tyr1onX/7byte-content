name: ep002-v17-continuity-render
# trigger: continuity preview PR

on:
  push:
    branches: [main]
    paths: [.github/workflows/ep002-v17-continuity-render.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/ep002-v17-continuity-render.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for helper
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish run id early
        shell: bash
        run: |
          cp scripts/_tmp_ep002_v17_transform.py /tmp/ep002-v17-transform.py
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-v17-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          printf '%s\n' "$GITHUB_RUN_ID" > preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 V17 render run id"
          git push origin HEAD:ep002-v17-render-previews --force

      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - name: Generate and persist V17
        shell: bash
        run: |
          python3 /tmp/ep002-v17-transform.py
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/002-wifi-full-signal/src/scenes/main-v16.tsx episodes/002-wifi-full-signal/src/scenes/main-v17.tsx episodes/002-wifi-full-signal/src/project.ts episodes/002-wifi-full-signal/design-notes.md
          git commit -m "feat(ep002): add object continuity transition V17"
          git push origin HEAD:feat/ep002-wifi-full-signal

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1
      - name: Capture
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '62500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-v17-silent-60fps.webm
      - uses: actions/upload-artifact@v4
        with:
          name: ep002-v17-silent-60fps
          path: output/ep002-v17-silent-60fps.webm
          if-no-files-found: error
          retention-days: 2
