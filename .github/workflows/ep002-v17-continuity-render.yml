name: ep002-v17-continuity-render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-v17-continuity-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for run id
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish run id early
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-v17-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          printf '%s\n' "$GITHUB_RUN_ID" > preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 V17 render run id"
          git push origin HEAD:ep002-v17-render-previews --force

      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - name: Build V16 baseline and V17 continuity scene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene15 = Path('episodes/002-wifi-full-signal/src/scenes/main-v15.tsx')
          source = scene15.read_text(encoding='utf-8')

          old_endpoint = '''        {/* Endpoint: softer, device-like silhouette. */}
        <Rect ref={chainPhone} x={-760} y={-30} width={180} height={220} radius={44} fill={'#141512'} stroke={C.border} lineWidth={2}>
          <Rect y={-22} width={116} height={150} radius={28} fill={C.raised} stroke={'#4A4E43'} lineWidth={2}>
            <Icon icon={'lucide:smartphone'} y={-16} size={48} color={C.text} />
            <Rect y={46} width={34} height={5} radius={3} fill={C.muted} opacity={0.72} />
          </Rect>
          <Txt y={88} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
        </Rect>'''

          new_endpoint = '''        {/* Endpoint V16+: one quiet container, one dominant device glyph. */}
        <Rect
          ref={chainPhone}
          x={-760}
          y={-30}
          width={166}
          height={184}
          radius={30}
          fill={'#141512'}
          stroke={C.border}
          lineWidth={2}
        >
          <Icon icon={'lucide:smartphone'} y={-26} size={70} color={C.text} />
          <Txt y={48} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
        </Rect>'''

          if old_endpoint not in source:
              raise SystemExit('V15 endpoint block not found; refusing broad replacement')

          v16 = source.replace(old_endpoint, new_endpoint, 1)
          v16 = v16.replace('yield* sendHop(-660, -555, chainRouter());', 'yield* sendHop(-670, -555, chainRouter());', 1)
          Path('episodes/002-wifi-full-signal/src/scenes/main-v16.tsx').write_text(v16, encoding='utf-8')

          v17 = v16
          decl_old = '''  const localWifiLine = createRef<Line>();
  const localInternetLine = createRef<Line>();'''
          decl_new = '''  const localWifiLine = createRef<Line>();
  const localInternetLine = createRef<Line>();
  const localBadge = createRef<Rect>();'''
          if decl_old not in v17:
              raise SystemExit('local declaration block not found')
          v17 = v17.replace(decl_old, decl_new, 1)

          badge_old = '''        <Rect x={-300} y={88} width={230} height={54} radius={18} fill={C.accentDark} stroke={'#415124'} lineWidth={2}>'''
          badge_new = '''        <Rect ref={localBadge} x={-300} y={88} width={230} height={54} radius={18} fill={C.accentDark} stroke={'#415124'} lineWidth={2}>'''
          if badge_old not in v17:
              raise SystemExit('local badge block not found')
          v17 = v17.replace(badge_old, badge_new, 1)

          transition_old = '''  // 19.693–23.329 — Preserve context, then establish the first focus pair.
  yield* all(
    waitFor(phase(4, 5)),
    local().opacity(0, 0.18),
    delay(0.14, chain().opacity(1, 0.24)),
    delay(0.7, c1().end(1, 0.7, easeInOutCubic)),
    delay(1.5, focusHop([chainPhone(), chainRouter()], [c1()], chainPhone(), chainRouter(), c1())),
  );'''

          transition_new = '''  // 19.693–23.329 — Preserve object identity while the local pair makes room for the full path.
  // The already-visible phone/router move into the exact topology positions first; only then do their
  // simplified Shot 3 counterparts crossfade in. c1 is pre-drawn while the chain is hidden, so the
  // wireless connector visually remains the same line instead of disappearing and being redrawn.
  c1().end(1);
  yield* all(
    waitFor(phase(4, 5)),
    localInternetLine().end(0, 0.42, easeInOutCubic),
    localInternet().opacity(0, 0.34, easeInOutCubic),
    localBadge().opacity(0, 0.28, easeInOutCubic),
    delay(
      0.18,
      all(
        localPhone().x(-760, 0.82, easeInOutCubic),
        localPhone().scale(0.46, 0.82, easeInOutCubic),
        localRouter().x(-420, 0.82, easeInOutCubic),
        localRouter().scale(0.72, 0.82, easeInOutCubic),
        localWifiLine().lineWidth(6, 0.55, easeInOutCubic),
      ),
    ),
    delay(0.94, chain().opacity(1, 0.34, easeInOutCubic)),
    delay(0.94, localPhone().opacity(0, 0.34, easeInOutCubic)),
    delay(0.94, localRouter().opacity(0, 0.34, easeInOutCubic)),
    delay(0.94, localWifiLine().opacity(0, 0.34, easeInOutCubic)),
    delay(1.34, local().opacity(0, 0.02)),
    delay(1.46, focusHop([chainPhone(), chainRouter()], [c1()], chainPhone(), chainRouter(), c1())),
  );'''

          if transition_old not in v17:
              raise SystemExit('V15 transition block not found; refusing broad replacement')
          v17 = v17.replace(transition_old, transition_new, 1)
          Path('episodes/002-wifi-full-signal/src/scenes/main-v17.tsx').write_text(v17, encoding='utf-8')

          project = Path('episodes/002-wifi-full-signal/src/project.ts')
          p = project.read_text(encoding='utf-8')
          if "./scenes/main-v15?scene" not in p:
              raise SystemExit('project.ts does not point to V15')
          project.write_text(p.replace('./scenes/main-v15?scene', './scenes/main-v17?scene', 1), encoding='utf-8')

          notes = Path('episodes/002-wifi-full-signal/design-notes.md')
          n = notes.read_text(encoding='utf-8') if notes.exists() else ''
          if '## V16 endpoint refinement' not in n:
              n += '''\n\n## V16 endpoint refinement\n\n- Accepted visual change: the endpoint uses one quiet container with one dominant smartphone glyph; the nested inner shell and decorative home-indicator line are removed.\n- Principle: endpoint identity should come from the device silhouette, not nested card chrome.\n'''
          if '## V17 object continuity experiment' not in n:
              n += '''\n\n## V17 object continuity experiment\n\n- Scope: only the Shot 2 → Shot 3 transition is changed; V16 endpoint, Focus System, BytePacket, subtitles, brand layers and outro remain intact.\n- V15 problem: Shot 2 faded out and Shot 3 faded in, forcing the viewer to rebuild the same phone/router relationship as if it were a new diagram.\n- V17 keeps the visible phone/router and their reactive connector on screen, moves/scales them into the topology positions, then crossfades to the simplified typed nodes at those same positions.\n- The Internet placeholder and its line retract/fade first, creating room for the expanded path. The Shot 3 c1 connector is pre-drawn while hidden so the local wireless link appears continuous through the handoff.\n- Audit rule: continuity transitions must be checked before, during, and after the handoff for double images, connector jumps, premature downstream nodes, and temporary UI residue.\n'''
          notes.write_text(n, encoding='utf-8')
          PY

          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/002-wifi-full-signal/src/scenes/main-v16.tsx episodes/002-wifi-full-signal/src/scenes/main-v17.tsx episodes/002-wifi-full-signal/src/project.ts episodes/002-wifi-full-signal/design-notes.md
          git commit -m "feat(ep002): add object continuity transition V17"
          git push origin HEAD:feat/ep002-wifi-full-signal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture 1920x1080 at 60fps
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '62500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-v17-silent-60fps.webm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ep002-v17-silent-60fps
          path: output/ep002-v17-silent-60fps.webm
          if-no-files-found: error
          retention-days: 2
