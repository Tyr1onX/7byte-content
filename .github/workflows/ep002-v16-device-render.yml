name: ep002-v16-device-render
# trigger: endpoint refinement preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-v16-device-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for run id
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish run id early
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-v16-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          printf '%s\n' "$GITHUB_RUN_ID" > preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 V16 render run id"
          git push origin HEAD:ep002-v16-render-previews --force

      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - name: Redesign endpoint node only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('episodes/002-wifi-full-signal/src/scenes/main-v15.tsx')
          dst = Path('episodes/002-wifi-full-signal/src/scenes/main-v16.tsx')
          text = src.read_text(encoding='utf-8')

          old = '''        {/* Endpoint: softer, device-like silhouette. */}
        <Rect ref={chainPhone} x={-760} y={-30} width={180} height={220} radius={44} fill={'#141512'} stroke={C.border} lineWidth={2}>
          <Rect y={-22} width={116} height={150} radius={28} fill={C.raised} stroke={'#4A4E43'} lineWidth={2}>
            <Icon icon={'lucide:smartphone'} y={-16} size={48} color={C.text} />
            <Rect y={46} width={34} height={5} radius={3} fill={C.muted} opacity={0.72} />
          </Rect>
          <Txt y={88} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
        </Rect>'''

          new = '''        {/* Endpoint V16: one quiet container, one dominant device glyph. */}
        <Rect
          ref={chainPhone}
          x={-760}
          y={-30}
          width={166}
          height={184}
          radius={30}
          fill={'#141512'}
          stroke={C.border}
          lineWidth={2}
        >
          <Icon icon={'lucide:smartphone'} y={-26} size={70} color={C.text} />
          <Txt y={48} text={'设备'} fill={C.text} fontFamily={FONT} fontSize={24} fontWeight={720} />
        </Rect>'''

          if old not in text:
              raise SystemExit('endpoint block not found; refusing broad replacement')

          text = text.replace(old, new, 1)
          text = text.replace('yield* sendHop(-660, -555, chainRouter());', 'yield* sendHop(-670, -555, chainRouter());', 1)
          dst.write_text(text, encoding='utf-8')

          project = Path('episodes/002-wifi-full-signal/src/project.ts')
          p = project.read_text(encoding='utf-8')
          if "./scenes/main-v15?scene" not in p:
              raise SystemExit('project.ts does not point to V15; refusing broad replacement')
          project.write_text(p.replace('./scenes/main-v15?scene', './scenes/main-v16?scene', 1), encoding='utf-8')

          notes = Path('episodes/002-wifi-full-signal/design-notes.md')
          n = notes.read_text(encoding='utf-8') if notes.exists() else ''
          n += '''\n\n## V16 endpoint refinement\n\n- Scope: Shot 3 device node only. Focus System, BytePacket, other node types, subtitles, brand layers and outro stay unchanged.\n- Root visual issue in V15: the endpoint used three nested visual layers (outer card → inner device shell → phone glyph), so the actual phone was visually weaker than its containers.\n- V16 removes the inner shell and decorative home-indicator line. The endpoint becomes one quiet outer container with one larger smartphone glyph and the label below it.\n- The connector remains geometry-bound to the node; the first BytePacket start position is adjusted to the slimmer endpoint edge.\n- Reusable principle: endpoint nodes should be recognized primarily by the device silhouette, not by nested card chrome.\n'''
          notes.write_text(n, encoding='utf-8')
          PY

          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/002-wifi-full-signal/src/scenes/main-v16.tsx episodes/002-wifi-full-signal/src/project.ts episodes/002-wifi-full-signal/design-notes.md
          git commit -m "feat(ep002): simplify endpoint node for V16"
          git push origin HEAD:feat/ep002-wifi-full-signal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture 1920x1080 at 60fps
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '62500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-v16-silent-60fps.webm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ep002-v16-silent-60fps
          path: output/ep002-v16-silent-60fps.webm
          if-no-files-found: error
          retention-days: 2
