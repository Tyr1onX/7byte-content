name: ep003-align-timing

on:
  push:
    branches:
      - feat/ep003-bandwidth-vs-download-speed
    paths:
      - .github/workflows/ep003-align-timing.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ep003-bandwidth-vs-download-speed

      - name: Patch final timing and wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('episodes/003-bandwidth-vs-download-speed/src/scenes/main.tsx')
          text = path.read_text(encoding='utf-8')

          old = """// Provisional V1 timing for composition preview only.\n// Replace with final Yunyang TTS cue boundaries before final animation alignment.\nconst T = [0, 5.4, 15.2, 24.8, 35.5, 43.5];"""
          new = """// Final phase boundaries derived from zh-CN-YunyangNeural TTS timing (script v2).\nconst T = [0, 8.53, 16.314, 32.19, 40.051, 49.535];"""

          if old not in text:
              raise SystemExit('Expected provisional timing block not found')

          text = text.replace(old, new, 1)
          text = text.replace("text={'理论上限'}", "text={'理论换算值'}")
          path.write_text(text, encoding='utf-8')

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: |
          npm install
          npm run build

      - name: Commit aligned scene
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/003-bandwidth-vs-download-speed/src/scenes/main.tsx
          git commit -m "feat(ep003): align scene to final narration timing"
          git push origin HEAD:feat/ep003-bandwidth-vs-download-speed
