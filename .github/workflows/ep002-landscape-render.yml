name: ep002-landscape-render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-landscape-render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/7byte-content/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture 1920x1080 at 60fps
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '58500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-landscape-silent-60fps.webm

      - name: Publish run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > output/run-id.txt
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          cp output/run-id.txt preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 landscape render run id"
          git push origin HEAD:ep002-render-previews --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ep002-landscape-silent-60fps
          path: output/
          retention-days: 3
