name: ep003-v5-brand-gold-render

on:
  push:
    branches:
      - feat/ep003-bandwidth-vs-download-speed
    paths:
      - .github/workflows/ep003-v5-brand-gold-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EP003 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep003-bandwidth-vs-download-speed

      - name: Publish V5 run id
        shell: bash
        run: |
          mkdir -p episodes/003-bandwidth-vs-download-speed/work
          printf '%s\n' "$GITHUB_RUN_ID" > episodes/003-bandwidth-vs-download-speed/work/v5-brand-run-id.txt
          git config user.name '7BYTE Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add episodes/003-bandwidth-vs-download-speed/work/v5-brand-run-id.txt
          git commit -m 'chore(ep003): publish temporary V5 brand run id'
          git push origin HEAD:feat/ep003-bandwidth-vs-download-speed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project, Chromium and CJK font
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install chromium
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei

      - name: Validate source
        run: npm run build

      - name: Prepare isolated EP003 player
        shell: bash
        run: |
          cat > vite.config.ts <<'EOF'
          import {defineConfig} from 'vite';
          import motionCanvas from '@motion-canvas/vite-plugin';
          export default defineConfig({
            base: '/7byte-content/',
            plugins: [motionCanvas({project: ['./episodes/003-bandwidth-vs-download-speed/src/project.ts']})],
          });
          EOF

          cat > vite.pages.config.ts <<'EOF'
          import {defineConfig} from 'vite';
          export default defineConfig({root: 'pages-preview', base: '/7byte-content/', build: {outDir: '../dist', emptyOutDir: false}});
          EOF

          mkdir -p pages-preview
          cat > pages-preview/index.html <<'EOF'
          <!doctype html><html><head><meta charset="UTF-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0F100E;overflow:hidden}body{display:grid;place-items:center}.frame{position:relative;width:min(96vw,calc(96vh*16/9));aspect-ratio:16/9;overflow:hidden;background:#0F100E}motion-canvas-player{display:block;width:100%;height:100%}#status{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#0F100E;color:#F4F1E8}#status[data-state=ready]{opacity:0;pointer-events:none}</style><script src="./project-manifest.js"></script></head><body><div class="frame"><motion-canvas-player id="player"></motion-canvas-player><div id="status">loading</div></div><script type="module" src="/main.ts"></script></body></html>
          EOF

          cat > pages-preview/main.ts <<'EOF'
          import '@motion-canvas/player';
          declare global {interface Window{__SEVENBYTE_PROJECT_PATH__?:string;__SEVENBYTE_START_CAPTURE_PLAYBACK__?:()=>void}}
          const player=document.querySelector('#player') as HTMLElement|null;
          const status=document.querySelector('#status') as HTMLElement|null;
          const delay=(ms:number)=>new Promise(r=>setTimeout(r,ms));
          async function boot(){if(!player)throw new Error('player missing');await customElements.whenDefined('motion-canvas-player');const p=window.__SEVENBYTE_PROJECT_PATH__;if(!p)throw new Error('manifest missing');const u=new URL(p,document.baseURI).href;player.setAttribute('src',u);const d=Date.now()+15000;while(Date.now()<d){const o=player.shadowRoot?.querySelector('.overlay') as HTMLElement|null;if(o?.classList.contains('state-ready')){window.__SEVENBYTE_START_CAPTURE_PLAYBACK__=()=>o.dispatchEvent(new MouseEvent('click',{bubbles:true,composed:true}));if(status)status.dataset.state='ready';return}await delay(100)}throw new Error('ready timeout')}void boot();
          EOF

      - name: Build isolated preview
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start local preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site >/tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/7byte-content/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Capture V5 body
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '45550'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep003-v5-silent.webm

      - name: Upload V5 body
        uses: actions/upload-artifact@v4
        with:
          name: ep003-v5-brand-gold
          path: output/ep003-v5-silent.webm
          if-no-files-found: error
          retention-days: 3
