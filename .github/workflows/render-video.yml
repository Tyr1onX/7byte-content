name: render-video

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - '.github/workflows/render-video.yml'
      - 'episodes/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to render
        required: true
        default: feat/ep002-wifi-full-signal
      duration_ms:
        description: Capture duration in milliseconds
        required: true
        default: '58500'
      width:
        description: Output width
        required: true
        default: '1920'
      height:
        description: Output height
        required: true
        default: '1080'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve render configuration
        id: render
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "duration_ms=${{ inputs.duration_ms }}" >> "$GITHUB_OUTPUT"
            echo "width=${{ inputs.width }}" >> "$GITHUB_OUTPUT"
            echo "height=${{ inputs.height }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "duration_ms=58500" >> "$GITHUB_OUTPUT"
            echo "width=1920" >> "$GITHUB_OUTPUT"
            echo "height=1080" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout episode source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.render.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install capture browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build Pages player
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start local preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture animation canvas
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: ${{ steps.render.outputs.duration_ms }}
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: ${{ steps.render.outputs.width }}
          CAPTURE_HEIGHT: ${{ steps.render.outputs.height }}
          CAPTURE_OUTPUT: output/silent-60fps.webm

      - name: Publish run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > output/run-id.txt
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          cp output/run-id.txt preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish render run id"
          git push origin HEAD:render-previews --force

      - name: Upload silent video
        uses: actions/upload-artifact@v4
        with:
          name: episode-silent-video-60fps
          path: output/
          if-no-files-found: error
          retention-days: 7
