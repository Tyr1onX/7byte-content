name: tts-demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tts-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Generate voice comparison pack
        shell: bash
        run: |
          mkdir -p output
          edge-tts --list-voices > output/voices.txt

          cat > output/sample.txt <<'EOF'
          你有没有想过，当你在浏览器里输入 baidu.com，然后按下回车，到网页真正出现之前，电脑到底干了什么？
          浏览器会先去问 DNS：这个域名对应哪个 IP？找到服务器以后，如果访问的是 HTTPS，还会先建立一条加密通道。
          这里是 7BYTE，把计算机讲简单一点。
          EOF

          generate() {
            voice="$1"
            slug="$2"
            rate="$3"
            pitch="$4"
            if grep -q "^${voice}[[:space:]]" output/voices.txt; then
              echo "Generating ${voice}"
              edge-tts \
                --voice "$voice" \
                --rate="$rate" \
                --pitch="$pitch" \
                --text "$(cat output/sample.txt)" \
                --write-media "output/${slug}.mp3" \
                --write-subtitles "output/${slug}.vtt"
            else
              echo "Voice unavailable: ${voice}" | tee -a output/unavailable.txt
            fi
          }

          # Four genuinely different male voices. No post pitch-shifting or voice layering.
          generate zh-CN-YunjianNeural A-yunjian '+0%' '+0Hz'
          generate zh-CN-YunyangNeural B-yunyang '-2%' '+0Hz'
          generate zh-CN-YunfengNeural C-yunfeng '-2%' '+0Hz'
          generate zh-CN-YunhaoNeural D-yunhao '-2%' '+0Hz'

          cat > output/README.txt <<'EOF'
          A = Yunjian：偏稳重、清楚
          B = Yunyang：偏成熟、播讲感
          C = Yunfeng：偏自然、克制
          D = Yunhao：偏低调、平静

          本轮全部使用原生不同声线，不使用上一版的后期降调处理，以避免“像两个人声叠在一起”的相位/音色伪影。
          EOF

      - name: Upload narration pack
        uses: actions/upload-artifact@v4
        with:
          name: ep001-ai-voice-comparison
          path: output/
          if-no-files-found: error
          retention-days: 7
