name: tts-demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tts-demo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Generate selected narration
        shell: bash
        run: |
          mkdir -p output
          cat > output/script.txt <<'EOF'
          你有没有想过，当你在浏览器里输入 baidu.com，然后按下回车，到网页真正出现之前，电脑到底干了什么？

          第一步，浏览器得先知道，百度到底在哪。因为网络通信真正要找的，不是 baidu.com 这个名字，而是服务器对应的 IP 地址。所以浏览器会先去问 DNS：这个域名，对应哪个 IP？DNS 把地址返回来以后，浏览器才知道接下来该去找哪台服务器。

          找到服务器以后，接下来就要建立连接。如果访问的是 HTTPS，还会先建立一条加密通道，后面的数据就会通过这条通道来传输。

          连接准备好以后，浏览器才会真正发送 HTTP 请求。比如 GET slash，你可以简单理解成一句话：把首页给我。

          服务器收到请求以后，就会把网页需要的东西陆续发回来。比如 HTML 负责页面结构，CSS 负责样式，JavaScript 负责交互，图片这些资源也会一起加载。

          浏览器一边接收这些内容，一边解析、排版，再把它们绘制到屏幕上。最后，你才真正看到了这个网页。

          所以你以为自己只是按了一次回车，但实际上背后已经完成了找地址、建立连接、加密、请求、传输和渲染这一整套流程。这里是 7BYTE，把计算机讲简单一点。
          EOF

          edge-tts \
            --voice zh-CN-YunyangNeural \
            --rate=-3% \
            --pitch=+0Hz \
            --text "$(cat output/script.txt)" \
            --write-media output/full-B-yunyang.mp3 \
            --write-subtitles output/full-B-yunyang.vtt

          base64 -w0 output/full-B-yunyang.mp3 > output/full-B-yunyang.b64
          printf '%s\n' "$GITHUB_RUN_ID" > output/run-id.txt

      - name: Upload selected narration
        uses: actions/upload-artifact@v4
        with:
          name: ep001-full-yunyang
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary preview branch
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan voice-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p previews
          cp output/full-B-yunyang.mp3 previews/full-B-yunyang.mp3
          cp output/full-B-yunyang.vtt previews/full-B-yunyang.vtt
          cp output/full-B-yunyang.b64 previews/full-B-yunyang.b64
          cp output/script.txt previews/script.txt
          cp output/run-id.txt previews/run-id.txt
          git add previews
          git commit -m "chore: publish selected Yunyang narration"
          git push origin HEAD:voice-previews --force
