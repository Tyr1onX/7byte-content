name: tts-demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tts-demo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Generate voice comparison pack
        shell: bash
        run: |
          mkdir -p output
          edge-tts --list-voices > output/voices.txt

          cat > output/sample.txt <<'EOF'
          你有没有想过，当你在浏览器里输入 baidu.com，然后按下回车，到网页真正出现之前，电脑到底干了什么？
          浏览器会先去问 DNS：这个域名对应哪个 IP？找到服务器以后，如果访问的是 HTTPS，还会先建立一条加密通道。
          这里是 7BYTE，把计算机讲简单一点。
          EOF

          generate() {
            voice="$1"
            slug="$2"
            rate="$3"
            pitch="$4"
            edge-tts \
              --voice "$voice" \
              --rate="$rate" \
              --pitch="$pitch" \
              --text "$(cat output/sample.txt)" \
              --write-media "output/${slug}.mp3" \
              --write-subtitles "output/${slug}.vtt"
          }

          # Four native male voice choices; no post-processing, no duplicated audio tracks.
          generate zh-CN-YunjianNeural A-yunjian '+0%' '+0Hz'
          generate zh-CN-YunyangNeural B-yunyang '-3%' '+0Hz'
          generate zh-CN-YunxiaNeural C-yunxia '-5%' '+0Hz'
          generate zh-TW-YunJheNeural D-yunjhe '-2%' '+0Hz'

          cat > output/README.txt <<'EOF'
          A = zh-CN-YunjianNeural：大陆男声，力度更足。
          B = zh-CN-YunyangNeural：大陆男声，新闻/播讲取向，更专业可靠。
          C = zh-CN-YunxiaNeural：大陆男声，更年轻、更轻。
          D = zh-TW-YunJheNeural：台湾男声，更平静自然，但口音会不同。

          这四个都是不同的原生声线，不使用上一版的 rubberband 降调，也不做任何双轨叠加。
          EOF

      - name: Upload narration pack
        uses: actions/upload-artifact@v4
        with:
          name: ep001-ai-voice-comparison
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary preview branch
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan voice-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p previews
          cp output/*.mp3 previews/
          cp output/*.vtt previews/
          cp output/README.txt previews/README.txt
          cp output/voices.txt previews/voices.txt
          git add previews
          git commit -m "chore: publish AI voice comparison previews"
          git push origin HEAD:voice-previews --force
