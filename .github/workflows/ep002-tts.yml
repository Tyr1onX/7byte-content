name: ep002-tts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-tts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Generate EP002 narration and timing
        shell: bash
        run: |
          mkdir -p output
          cat > output/script.txt <<'EOF'
          Wi-Fi 明明是满格，为什么网页还是打不开？
          因为 Wi-Fi 满格，和能不能上网，其实是两回事。
          你手机上的 Wi-Fi 图标，主要反映的是手机到路由器这一段的无线信号。
          所以就算它满格，也只能说明你离路由器够近，信号够强。
          但真正打开一个网页，还得继续往后走。
          路由器要连上运营商网络，DNS 要找到网站地址，最后还得真的连得上网站服务器。
          所以宽带断了、DNS 出问题，或者网站自己挂了，你的 Wi-Fi 都可能还是满格。
          下次遇到这种情况，先试试其他网站，再看看同一个 Wi-Fi 下，其他设备能不能上网。
          如果大家都上不了，大概率问题不在你的手机。
          所以记住：Wi-Fi 满格，不等于互联网畅通。
          它只说明，你和路由器之间这一小段路，信号很好。
          这里是 7BYTE，把计算机讲简单一点。
          EOF

          edge-tts \
            --voice zh-CN-YunyangNeural \
            --rate=-2% \
            --text "$(cat output/script.txt)" \
            --write-media output/ep002-yunyang.mp3 \
            --write-subtitles output/ep002-yunyang.vtt

          base64 -w0 output/ep002-yunyang.mp3 > output/ep002-yunyang.b64

      - name: Publish preview assets
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p previews
          cp output/ep002-yunyang.b64 previews/
          cp output/ep002-yunyang.vtt previews/
          cp output/script.txt previews/
          printf '%s\n' "$GITHUB_RUN_ID" > previews/run-id.txt
          git add previews
          git commit -m "chore: publish EP002 Yunyang narration"
          git push origin HEAD:ep002-previews --force
