name: ep002-v21-shared-element-render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ep002-v21-shared-element-render.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main for run id
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish run id early
        shell: bash
        run: |
          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan ep002-v21-render-previews
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p preview
          printf '%s\n' "$GITHUB_RUN_ID" > preview/run-id.txt
          git add preview/run-id.txt
          git commit -m "chore: publish EP002 V21 render run id"
          git push origin HEAD:ep002-v21-render-previews --force

      - name: Checkout EP002 source
        uses: actions/checkout@v4
        with:
          ref: feat/ep002-wifi-full-signal

      - name: Build V21 matched-geometry handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('episodes/002-wifi-full-signal/src/scenes/main-v20.tsx')
          s = src.read_text(encoding='utf-8')

          old_router = '''          <Rect ref={chainRouter} x={-420} y={-30} width={250} height={170} radius={18} fill={C.surface} stroke={C.border} lineWidth={2}>
            <Rect y={-80} width={210} height={5} radius={3} fill={C.accent} opacity={0.78} />
            <Icon icon={'lucide:router'} x={-76} y={-8} size={48} color={C.accent} />
            <Txt x={34} y={-21} text={'路由器'} fill={C.text} fontFamily={FONT} fontSize={26} fontWeight={730} />
            <Txt x={34} y={23} text={'无线接入'} fill={C.muted} fontFamily={FONT} fontSize={18} fontWeight={520} />
          </Rect>'''
          new_router = '''          <Rect ref={chainRouter} x={-420} y={-30} width={280} height={145} radius={22} fill={C.surface} stroke={C.border} lineWidth={2}>
            <Rect y={-68} width={236} height={5} radius={3} fill={C.accent} opacity={0.78} />
            <Icon icon={'lucide:router'} x={-86} y={-5} size={48} color={C.accent} />
            <Txt x={35} y={-18} text={'路由器'} fill={C.text} fontFamily={FONT} fontSize={26} fontWeight={730} />
            <Txt x={35} y={22} text={'无线接入'} fill={C.muted} fontFamily={FONT} fontSize={18} fontWeight={520} />
          </Rect>'''
          if old_router not in s:
              raise SystemExit('V20 chain router block not found')
          s = s.replace(old_router, new_router, 1)

          old_transition = '''  // 19.693–23.329 — Keep phone/router identity while expanding to the topology.
  c1().end(1);
  yield* all(
    waitFor(phase(4, 5)),
    localInternetLine().end(0, 0.42, easeInOutCubic),
    localInternet().opacity(0, 0.34, easeInOutCubic),
    localBadge().opacity(0, 0.28, easeInOutCubic),
    delay(
      0.18,
      all(
        localPhone().x(-760, 0.82, easeInOutCubic),
        localPhone().scale(0.46, 0.82, easeInOutCubic),
        localRouter().x(-420, 0.82, easeInOutCubic),
        localRouter().scale(0.72, 0.82, easeInOutCubic),
        localWifiLine().lineWidth(6, 0.55, easeInOutCubic),
      ),
    ),
    delay(0.94, chain().opacity(1, 0.34, easeInOutCubic)),
    delay(0.94, localPhone().opacity(0, 0.34, easeInOutCubic)),
    delay(0.94, localRouter().opacity(0, 0.34, easeInOutCubic)),
    delay(0.94, localWifiLine().opacity(0, 0.34, easeInOutCubic)),
    delay(1.34, local().opacity(0, 0.02)),
  );'''
          new_transition = '''  // 19.693–23.329 — V21 shared-element handoff: match geometry before abstraction changes.
  // The detailed phone/router keep ownership while moving. The simplified nodes only take over
  // during the final part of the move, after their visible bounds are nearly identical.
  c1().end(1);
  chainPhone().scale(0.97);
  chainRouter().scale(0.97);
  yield* all(
    waitFor(phase(4, 5)),
    localInternetLine().end(0, 0.46, easeInOutCubic),
    localInternet().opacity(0, 0.38, easeInOutCubic),
    localBadge().opacity(0, 0.32, easeInOutCubic),
    delay(
      0.16,
      all(
        localPhone().x(-760, 1.10, easeInOutCubic),
        localPhone().scale(0.46, 1.10, easeInOutCubic),
        localRouter().x(-420, 1.10, easeInOutCubic),
        // 360×170 × 0.78 ≈ 281×133, closely matching the V21 280×145 topology node.
        localRouter().scale(0.78, 1.10, easeInOutCubic),
        localWifiLine().lineWidth(6, 0.82, easeInOutCubic),
      ),
    ),
    // Crossfade is delayed until the shared elements are almost at the same screen-space bounds.
    delay(1.00, chain().opacity(1, 0.52, easeInOutCubic)),
    delay(1.00, localPhone().opacity(0, 0.52, easeInOutCubic)),
    delay(1.00, localRouter().opacity(0, 0.52, easeInOutCubic)),
    delay(1.00, localWifiLine().opacity(0, 0.52, easeInOutCubic)),
    delay(1.00, chainPhone().scale(1, 0.52, easeInOutCubic)),
    delay(1.00, chainRouter().scale(1, 0.52, easeInOutCubic)),
    delay(1.56, local().opacity(0, 0.02)),
  );'''
          if old_transition not in s:
              raise SystemExit('V20 Shot 2→3 transition block not found')
          s = s.replace(old_transition, new_transition, 1)

          s = s.replace('// 23.329–30.663 — V19 camera: one continuous move, no stop/restart at each node.',
                        '// 23.329–30.663 — V21 camera: preserve the accepted continuous move.', 1)

          out = Path('episodes/002-wifi-full-signal/src/scenes/main-v21.tsx')
          out.write_text(s, encoding='utf-8')

          project = Path('episodes/002-wifi-full-signal/src/project.ts')
          p = project.read_text(encoding='utf-8')
          if './scenes/main-v20?scene' not in p:
              raise SystemExit('project.ts does not point to V20')
          project.write_text(p.replace('./scenes/main-v20?scene', './scenes/main-v21?scene', 1), encoding='utf-8')

          notes = Path('episodes/002-wifi-full-signal/design-notes.md')
          n = notes.read_text(encoding='utf-8')
          marker = '## V21 shared-element abstraction handoff'
          if marker not in n:
              n += '''\n\n## V21 shared-element abstraction handoff\n\nThe Shot 2 → Shot 3 transition was visually correct in meaning but still felt synthetic because the same phone/router changed **geometry and abstraction level at the same instant**. In V20 the local router ended near 259×122 px while the topology router appeared at 250×170 px, so the crossfade contained a visible aspect-ratio pop.\n\nV21 applies a shared-element geometry contract:\n\n- same semantic object keeps its screen-space center throughout the handoff;\n- source and target bounds must be close before opacity ownership changes;\n- abstraction changes happen during the final portion of motion, not after a full stop;\n- connector ownership crossfades with the nodes, so the relationship itself does not blink;\n- the topology router is reshaped to 280×145, while the outgoing local router ends around 281×133, removing the large height jump;\n- the simplified phone/router begin at 97% scale and settle to 100% during the crossfade, preventing a hard model swap.\n\n### Permanent guard\n\nFor a same-object transition, compare the source/target bounding boxes at the ownership frame. If either width or height differs by roughly >15%, treat it as a new composition and redesign the handoff instead of hiding the mismatch with a fast crossfade.\n'''
              notes.write_text(n, encoding='utf-8')

          shot = Path('skills/shot-design.md')
          q = shot.read_text(encoding='utf-8')
          rule = '- 同一语义对象跨镜头改变抽象层级时，先匹配屏幕位置与外接框，再交接 opacity；不要让“尺寸/纵横比跳变”和“模型替换”发生在同一帧。'
          if rule not in q:
              q = q.rstrip() + '\n' + rule + '\n'
              shot.write_text(q, encoding='utf-8')
          PY

          git config user.name "7BYTE Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add episodes/002-wifi-full-signal/src/scenes/main-v21.tsx episodes/002-wifi-full-signal/src/project.ts episodes/002-wifi-full-signal/design-notes.md skills/shot-design.md
          git commit -m "refactor(ep002): smooth shared-element topology handoff"
          git push origin HEAD:feat/ep002-wifi-full-signal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'

      - name: Start preview
        shell: bash
        run: |
          rm -rf .capture-site
          mkdir -p .capture-site/7byte-content
          cp -a dist/. .capture-site/7byte-content/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .capture-site > /tmp/7byte-http.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/7byte-content/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/7byte-http.log
          exit 1

      - name: Capture 1920x1080 at 60fps
        run: node scripts/capture-pages-video.mjs
        env:
          CAPTURE_URL: http://127.0.0.1:4173/7byte-content/?capture=1
          CAPTURE_DURATION_MS: '62500'
          CAPTURE_FPS: '60'
          CAPTURE_BITRATE: '20000000'
          CAPTURE_WIDTH: '1920'
          CAPTURE_HEIGHT: '1080'
          CAPTURE_OUTPUT: output/ep002-v21-silent-60fps.webm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ep002-v21-silent-60fps
          path: output/ep002-v21-silent-60fps.webm
          if-no-files-found: error
          retention-days: 2
